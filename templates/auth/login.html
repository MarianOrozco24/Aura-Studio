{% extends 'backoffice/base_backoffice.html' %}
{% block header %}{% endblock %}
{% block content %}
<section class="max-w-md mx-auto">
<div class="glass p-8">
<h1 class="text-2xl font-semibold text-zinc-800 mb-1">Iniciar sesión</h1>
<p class="text-sm text-zinc-500 mb-6">Accedé al panel administrativo</p>


<form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
{{ form.csrf_token if form and form.csrf_token }}
<div>
<label class="text-sm text-zinc-700">Email</label>
<input type="email" name="email" required class="mt-1 w-full rounded-xl border border-white/50 bg-white/70 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-zfIndigo/40" placeholder="nombre@correo.com" />
</div>
<div>
<label class="text-sm text-zinc-700">Contraseña</label>
<input type="password" name="password" required class="mt-1 w-full rounded-xl border border-white/50 bg-white/70 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-zfIndigo/40" placeholder="••••••••" />
</div>
<div class="flex items-center justify-between text-sm">
<label class="inline-flex items-center gap-2 select-none">
<input type="checkbox" name="remember" class="rounded border-zinc-300" />
Recordarme
</label>
<a href="{{ url_for('auth.forgot') }}" class="text-zfIndigo hover:underline">¿Olvidaste tu contraseña?</a>
</div>
<button class="w-full rounded-xl bg-zfIndigo text-white py-2.5 hover:opacity-90 transition">Ingresar</button>
</form>


<p class="text-center text-sm text-zinc-600 mt-4">¿No tenés cuenta?
<a href="{{ url_for('auth.register') }}" class="text-zfPink hover:underline">Crear cuenta</a>
</p>
</div>
</section>
{% endblock %}
