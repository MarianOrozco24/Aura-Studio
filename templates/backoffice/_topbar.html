<header class="sticky top-0 z-20 p-4 md:p-6">
<div class="glass px-4 md:px-6 py-3 flex items-center justify-between">
<div class="flex items-center gap-3">
<button class="md:hidden rounded-xl px-3 py-2 bg-white/80" onclick="toggleSidebar()">☰</button>
<span class="hidden md:inline text-zinc-500">Bienvenido al panel</span>
</div>
<div class="flex items-center gap-4">
<div class="text-right hidden sm:block">
<p class="text-sm font-medium text-zinc-800">{{ current_user.name if current_user else 'Usuario' }}</p>
<p class="text-xs text-zinc-500">{{ current_user.email if current_user else 'user@mail.com' }}</p>
</div>
<div class="w-10 h-10 rounded-xl bg-zfPink/10 grid place-items-center text-zfPink">👩‍💻</div>
</div>
</div>
</header>
