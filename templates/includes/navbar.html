<header class="fixed top-0 left-0 w-full z-50 bg-white/40 backdrop-blur-xl border-b border-white/20 shadow-sm" data-aos="fade-down">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <a href="/" class="text-2xl font-bold tracking-tight text-indigo-600">Aura Studio</a>

    <!-- MENÚ MÓVIL -->
    <div x-data="{ open: false }" class="relative">
      <button @click="open = !open" class="sm:hidden text-zinc-800 focus:outline-none">
        <svg x-show="!open" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
             viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <svg x-show="open" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
             viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <!-- Menú desplegable móvil -->
      <div x-show="open" @click.away="open = false"
           class="absolute right-0 mt-2 w-48 bg-white shadow-md rounded-lg py-2 z-50 sm:hidden text-sm text-zinc-800 font-medium max-w-[100vw] overflow-x-hidden">
        <a href="/" class="block px-4 py-2 hover:bg-indigo-100">Inicio</a>
        <a href="/servicios" class="block px-4 py-2 hover:bg-indigo-100">Servicios</a>
        <a href="/portfolio" class="block px-4 py-2 hover:bg-indigo-100">Portfolio</a>
        <!-- <a href="/turnos" class="text-zinc-800 hover:text-indigo-600 transition">Turnos</a> -->
        <!-- <a href="/contacto" class="block px-4 py-2 hover:bg-indigo-100">Contacto</a> -->
        

      </div>
    </div>

    <!-- MENÚ DESKTOP -->
    <nav class="hidden sm:flex space-x-4 sm:space-x-6 text-sm sm:text-base font-medium">
      <a href="/" class="text-zinc-800 hover:text-indigo-600 transition">Inicio</a>
      <a href="/servicios" class="text-zinc-800 hover:text-indigo-600 transition">Servicios</a>
      <a href="/portfolio" class="text-zinc-800 hover:text-indigo-600 transition">Portfolio</a>
      <!-- <a href="/turnos" class="text-zinc-800 hover:text-indigo-600 transition">Turnos</a> -->
      <!-- <a href="/contacto" class="text-zinc-800 hover:text-indigo-600 transition">Contacto</a> -->
    </nav>
  </div>
</header>
